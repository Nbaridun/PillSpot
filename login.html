```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PillSpot</title>
    <style>
       
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f9f8;
}

.login-container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 400px;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
}

.login-box h1 {
    text-align: center;
    color: #198754;
    margin-bottom: 20px;
}

.login-box h2 {
    text-align: center;
    color: #333;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

.input-group {
    margin-bottom: 18px;
}

.input-group label {
    display: block;
    margin-bottom: 7px;
    color: #333;
    font-weight: bold;
}

.input-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
}

.input-group input:focus {
    border-color: #198754;
}

.login-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    font-size: 13px;
}

.login-options label {
    color: #555;
}

.login-options input {
    margin-right: 5px;
}

.login-options a {
    color: #198754;
    text-decoration: none;
}

.login-options a:hover {
    text-decoration: underline;
}

.login-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #198754;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.login-btn:hover {
    background: #146c43;
}

.signup-text {
    text-align: center;
    margin-top: 20px;
    color: #666;
    font-size: 14px;
}

.signup-text a {
    color: #198754;
    text-decoration: none;
    font-weight: bold;
}

.signup-text a:hover {
    text-decoration: underline;
}

@media (max-width: 450px) {
    .login-box {
        width: 100%;
        padding: 25px;
    }
}

</style>
</head>
<body>

    <div class="login-container">

        <div class="login-box">

            <h1>PillSpot</h1>
            <h2>Welcome Back!</h2>
            <p class="subtitle">Login to your PillSpot account</p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="Enter your email" 
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password" 
                        required
                    >
                </div>

                <div class="login-options">
                    <label>
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

        </div>

    </div>

    <script>
        ```javascript
document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (email === "" || password === "") {
        alert("Please enter your email and password.");
        return;
    }

    if (password.length < 6) {
        alert("Password must be at least 6 characters long.");
        return;
    }

    alert("Login successful!");

    // Redirect to homepage
    window.location.href = "index.html";
});
```
    </script>

</body>
</html>
```
